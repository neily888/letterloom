name: Letterloom tests
on:
  push:
    branches: [main, feature/relaxed-oz-qi-v1.22]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check browser script syntax
        run: node --check app.js && node --check bot.worker.js && node --check sw.js
